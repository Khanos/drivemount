name: Check and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Linux build libraries and test tools
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libgtk-3-dev rclone fuse3
      - run: python3 packaging/verify_vendor.py
      - run: python3 -m unittest discover -s packaging -p "test_*.py"
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --no-default-features --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npx playwright install --with-deps chromium
      - run: CHROMIUM_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')" npm run test:e2e
      - run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --test glib_regression
      - run: npm audit --audit-level=low
      - run: npm run package:deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drivemount-linux
          path: src-tauri/target/release/bundle/deb/*.deb
