[package]
name = "drivemount"
version = "0.1.1"
description = "Your Google Drive, right in your Linux files."
authors = ["DriveMount contributors"]
edition = "2021"
rust-version = "1.99"
license = "MIT"

[lib]
name = "drivemount_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "drivemount"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance", "dep:tauri-build", "dep:glib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
async-trait = "0.1"
fs2 = "0.4"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
which = "8"
zeroize = { version = "1", features = ["derive"] }
glib = { version = "0.18.5", optional = true }
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true

[patch.crates-io]
# Backport of gtk-rs-core#1343; see vendor/glib/DRIVEMOUNT-PATCH.md.
glib = { path = "vendor/glib" }
